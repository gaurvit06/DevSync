server.port=${PORT:8086}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3308/devsync}
spring.datasource.username=${DATABASE_USER:devsync}
spring.datasource.password=${DATABASE_PASSWORD:devsync-local-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
devsync.ai.key=${AI_API_KEY:}
devsync.ai.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
devsync.ai.model=${AI_MODEL:gpt-4.1-mini}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
